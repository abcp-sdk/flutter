name: agent_app
description: "Standalone agent chat client (agent.v1.AgentService via easylab SDK surface)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_markdown_plus: ^1.0.0
  collection: ^1.19.1
  path_provider: ^2.1.6
  file_picker: ^12.1.3
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  intl: any
  re_highlight: ^0.0.3
  agent_client_sdk:
    path: ../agent-sdk-dart
  connectrpc: ^2.0.0
  protobuf: ^6.0.0
  http2: ^2.3.0
  record: ^7.1.1
  just_audio: ^0.10.6
  video_player: ^2.14.0
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/certs/
