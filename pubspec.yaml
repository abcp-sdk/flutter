name: agent_app
description: "Standalone agent chat client (agent.v1.AgentService via easylab SDK surface)."
publish_to: 'none'
version: 0.1.0+69

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_markdown_plus: ^1.0.0
  collection: ^1.19.1
  path_provider: ^2.1.6
  file_picker: ^12.1.3
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  intl: any
  re_highlight: ^0.0.3
  agent_client_sdk:
    path: ../agent-sdk-dart
  connectrpc: ^2.0.0
  protobuf: ^6.1.0
  http2: ^2.3.0
  record: ^7.1.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  web: ^1.1.1
  # Clipboard image/file paste (desktop + Android) and file drag-and-drop
  # (all platforms). Attachment naming uses uuid v4.
  pasteboard: ^0.5.0
  desktop_drop: ^0.8.4
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/certs/
  # Bundled so the app renders CJK/latin consistently on systems with no
  # fonts installed (e.g. minimal Linux desktop / container).
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    # Bundled emoji font (CBDT color): on the web there is no system font to
    # fall back to, and the engine's remote fallback service is deliberately
    # disabled (no gstatic dependency), so emoji must ship with the app.
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
