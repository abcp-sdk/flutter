name: agent_app
description: "Agent chat app (agent.v1.AgentService over Connect/HTTP2-TLS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_markdown_plus: ^1.0.0
  agent_client_sdk:
    path: ../agent-sdk-dart
  connectrpc: ^2.0.0
  protobuf: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/certs/
