name: desktop_drop
description: A plugin which allows user dragging files to your flutter desktop applications.
version: 0.8.4
homepage: https://github.com/MixinNetwork/flutter-plugins/tree/main/packages/desktop_drop

environment:
  sdk: ^3.5.0
  flutter: ">=3.0.0"

dependencies:
  dbus: ^0.7.10
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cross_file: ^0.3.4+2
  web: ^1.1.1
  universal_platform: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# NOTE: vendored copy (see tool/regen-third-party.sh). The `android`
# platform entry is intentionally REMOVED so the Android Gradle build does
# not pull the KGP-applying module (Flutter 3.47 warns it will break in a
# future release). Clipboard paste / drag-and-drop are desktop+web features
# here; Dart sources are byte-for-byte upstream.
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: DesktopDropPlugin
      linux:
        pluginClass: DesktopDropPlugin
      windows:
        pluginClass: DesktopDropPlugin
      web:
        pluginClass: DesktopDropWeb
        fileName: desktop_drop_web.dart
